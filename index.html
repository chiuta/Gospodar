              {label: T('sens_plain'), value: 'plain'},
              {label: T('sens_enc'), value: 'enc', primary: true}

    inspect: function (file, opt) {

        var unknown = unknownKeys(keys);
        var msg = T('confirm_import', {n: keys.length, app: slug, ver: o.version || '?', date: (o.exported || '').slice(0, 10) || '?'}) +
          '\n\n' + T('import_keys', {list: keyList(keys)}) +
          (unknown.length ? '\n\n' + T('import_unknown', {n: unknown.length, list: keyList(unknown)}) : '');

          .then(function (ok) {

            try {

            } catch (e) {

    /** Șterge DOAR cheile indexate ale aplicației (și cele fff.<slug>.*). */
    wipe: function (opt) {

      var keys = F.store.indexKeys();
      if (!keys.length) return Promise.resolve({keys: 0, cancelled: false});

        F.bus.emit('bundle:wiped', {keys: keys.length});
        if (opt.reload === true) setTimeout(function () { location.reload(); }, opt.delay == null ? 900 : opt.delay);
        return {keys: keys.length, cancelled: false};
      });
    }
  };
})();

.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0 .7rem;margin:.6rem 0 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem 0}

.prof select{min-width:12rem}
.derr2,.derr{color:var(--neg);font-size:.9rem;font-weight:600;margin:.3rem 0;min-height:0}

.tw{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:.5rem 0}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{padding:.4rem .6rem;text-align:left;border-top:1px solid var(--line);vertical-align:top}
.tbl thead th{border-top:0;background:var(--surface2);font-size:.82rem;color:var(--ink2);white-space:nowrap}
.tbl tfoot th,.tbl tfoot td{background:var(--surface2);font-weight:700}
.tbl .n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl .c{text-align:center;width:2rem}
.tbl .desc{overflow-wrap:anywhere;min-width:10rem}
.tbl th[scope=row]{font-weight:600}
.tbl th.lvl1{padding-left:1.6rem;font-weight:400}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl tr.rerr td:first-child{box-shadow:inset 4px 0 var(--neg)}
.tbl tr.rdup td:first-child{box-shadow:inset 4px 0 var(--warnbar)}
.tbl .acts{white-space:nowrap}
.tbl .acts .btn{margin-right:.2rem}
.pager{display:flex;gap:.8rem;align-items:center;justify-content:center;margin:.6rem 0}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;list-style:none;margin:.4rem 0;padding:0}
.chips li{padding:.15rem .7rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.9rem}
.chips .okc{border-color:var(--pos)}.chips .errc{border-color:var(--neg);color:var(--neg)}.chips .warnc{border-color:var(--warnbar);color:var(--warnink)}
.warnc{color:var(--warnink)}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:1.4rem}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;padding:.25rem 0;border-top:1px solid var(--line)}
.trow .sp{flex:1}
.mnav{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:.3rem 0 .6rem}
.mlabel{min-width:9rem;text-align:center;text-transform:capitalize}
/* calculatoare / grafice */
.tabs{margin-top:.4rem}
dl.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.6rem;margin:.8rem 0}
dl.kv>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem}
dl.kv dt{font-size:.8rem;color:var(--ink2)}
dl.kv dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
dl.kv dd.big{font-size:1.35rem;color:var(--accent)}
details{margin:.5rem 0}
summary{cursor:pointer;font-weight:600;padding:.2rem 0}
details.formula{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.4rem .9rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88rem}
.chart{max-width:100%;height:auto;display:block;margin:.4rem 0}
.chart .lbl{fill:var(--ink2);font:11px var(--sans)}
.chart .val{fill:var(--ink);font:11px var(--sans)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--ink2);stroke-width:1}
.c-acc{fill:var(--accent)}.c-pos{fill:var(--pos)}.c-neg{fill:var(--neg)}.c-warn{fill:var(--warnbar)}.c-line{fill:var(--ink)}
.chart .lineo{stroke:var(--ink);stroke-width:2}
.chart .dot{fill:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;list-style:none;margin:.2rem 0;padding:0;font-size:.85rem;color:var(--ink2)}
.qstat{min-height:1.3rem;font-size:.9rem;color:var(--pos);font-weight:600}
/* dialog */
.dlg{border:1px solid var(--line);border-radius:12px;padding:0;width:min(560px,calc(100vw - 20px));background:var(--surface);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.dlg.wide{width:min(780px,calc(100vw - 20px))}
.dlg::backdrop{background:rgba(0,0,0,.5)}
.dform{display:flex;flex-direction:column;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px)}
.dform>header{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
.dform>header h2{margin:0;font-size:1.1rem}
.dbody{padding:.8rem 1rem 0;overflow:auto;min-height:0}
.dform>.derr{padding:0 1rem}
.dform>footer{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:flex-end;padding:.7rem 1rem;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:1rem;transform:translate(-50%,200%);max-width:min(560px,calc(100vw - 24px));display:flex;gap:.7rem;align-items:center;background:var(--ink);color:var(--bg);padding:.55rem .9rem;border-radius:10px;z-index:200;transition:transform .2s}
#toast:empty{display:none}
#toast.on{transform:translate(-50%,0)}
#toast .btn{color:var(--ink);background:var(--surface)}
/* blocare */
#lock{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:1rem}
#lock[hidden]{display:none!important}
.lockbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.2rem;width:min(420px,100%)}
.foot{padding:1rem;color:var(--ink2);font-size:.82rem;max-width:1200px;margin:0 auto;width:100%}
.foot p{margin:.25rem 0}
#printReport{display:none}
@media (max-width:700px){
  main{padding:.7rem}
  #nav{flex-wrap:nowrap;overflow-x:auto}
  .tbl.stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .tbl.stack,.tbl.stack tbody,.tbl.stack tr,.tbl.stack td,.tbl.stack th[scope=row]{display:block;width:100%}
  .tbl.stack tr{border-top:1px solid var(--line);padding:.35rem 0}
  .tbl.stack td,.tbl.stack th[scope=row]{border:0;padding:.15rem .6rem;display:flex;justify-content:space-between;gap:.8rem;text-align:right}
  .tbl.stack td[data-l]::before,.tbl.stack th[data-l]::before{content:attr(data-l);color:var(--ink2);font-size:.8rem;text-align:left;flex:none}
  .tbl.stack td.c{width:auto;text-align:left}
  .tbl.stack td.desc{min-width:0}
  .tbl.stack th.lvl1{padding-left:1.4rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{
  :root:root:root{--bg:#fff;--surface:#fff;--surface2:#f0f0f0;--ink:#000;--ink2:#333;--line:#999;--accent:#0f6b5c;--pos:#16643a;--neg:#b42318;--warnbg:#fff;--warnbar:#8a5a00;--warnink:#000;color-scheme:light}
  body>*:not(#printReport){display:none!important}
  #printReport{display:block!important;padding:0;font-size:10.5pt}
  #printReport .ph0{border-bottom:2px solid #000;margin-bottom:.6rem}
  #printReport .panel{break-inside:avoid;border:1px solid #999}
  #printReport .tw{overflow:visible;border:0}
  #printReport details>*{display:revert}
  #printReport details:not([open])>summary~*{display:none}
  #printReport .bl-h,#printReport .tbl{font-size:9.5pt}
  .btn,#toast{display:none!important}
}

 „verificarea soldurilor” din previzualizare: dacă numărul de nepotriviri scade după ce bifezi, interpretarea este cea potrivită pentru fișierul tău.|Both options are off by default and never apply themselves: we cannot verify whether the amount in the file already includes the fee, nor how states are named in your export’s language. Use the “balance check” in the preview: if the number of mismatches drops after you tick an option, that interpretation fits your file.|Les deux options sont désactivées par défaut et ne s’appliquent jamais seules : nous ne pouvons pas vérifier si le montant du fichier inclut déjà les frais, ni comment les statuts sont nommés dans la langue de votre export. Utilisez la « vérification des soldes » de l’aperçu : si le nombre d’écarts baisse après avoir coché une option, cette interprétation convient à votre fichier.|Entrambe le opzioni sono disattivate per impostazione predefinita e non si applicano da sole: non possiamo verificare se l’importo nel file includa già la commissione, né come siano chiamati gli stati nella lingua della tua esportazione. Usa il «controllo dei saldi» nell’anteprima: se il numero di discrepanze cala dopo aver spuntato un’opzione, quell’interpretazione è adatta al tuo file.|Ambas opciones están desactivadas por defecto y nunca se aplican solas: no podemos comprobar si el importe del archivo ya incluye la comisión, ni cómo se llaman los estados en el idioma de tu exportación. Usa la «comprobación de saldos» de la vista previa: si el número de discrepancias baja al marcar una opción, esa interpretación encaja con tu archivo.|Ambas as opções estão desativadas por defeito e nunca se aplicam sozinhas: não podemos verificar se o montante do ficheiro já inclui a comissão, nem como se chamam os estados na língua da sua exportação. Use a «verificação de saldos» da pré-visualização: se o número de divergências baixar ao marcar uma opção, essa interpretação serve para o seu ficheiro.|Mindkét beállítás alapból ki van kapcsol   const keys = []; for (let k = 0; k <= N; k++) keys.push(addMonthsKey(cm, k));

function niceCeil(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
const trunc = (s, n) => { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
function compactN(minor, cur) { const v = minor / Math.pow(10, dec(cur)); return new Intl.NumberFormat(G.LOCALES[G.getLang()], { notation: 'compact', maximumFractionDigits: 1 }).format(v); }
function chartWidth() { const v = $('view'); const w = v ? v.clientWidth - 32 : 640; return Math.max(300, Math.min(900, w)); }

function svgWrap(W, H, title, desc, inner) { const id = 'svg' + (++svgSeq); return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-labelledby="${id}t ${id}d" focusable="false"><title id="${id}t">${esc(title)}</title><desc id="${id}d">${esc(desc)}</desc>${inner}</svg>`; }

}
/** bare grupate/stivuite pe luni. series: [{name, cls, vals[]}], stacked? */
function colChart(labels, series, o) {

  for (let i = 0; i < n; i++) { if (o.stacked) { let p = 0, q = 0; series.forEach(sr => { const v = sr.vals[i]; if (v >= 0) p += v; else q += v; }); mx = Math.max(mx, p); mn = Math.min(mn, q); } else series.forEach(sr => { mx = Math.max(mx, sr.vals[i]); mn = Math.min(mn, sr.vals[i]); }); }

  let s = ''; for (let k = 0; k <= 4; k++) { const v = bot + (top - bot) * k / 4; const y = mt + (top - v) * sc; s += `<line x1="${ml}" x2="${W - mr}" y1="${y}" y2="${y}" class="grid"/><text x="${ml - 5}" y="${y + 4}" text-anchor="end" class="lbl">${esc(compactN(v, cur))}</text>`; }

    });

}

}
